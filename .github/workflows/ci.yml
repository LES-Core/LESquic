name: CI

on:
  push:
    branches: [main]
    paths:
      - "lesquic/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Generate dev cert
        run: ./scripts/gen_cert.sh
      - name: Run smoke test
        run: python -u tests/test_smoke.py
